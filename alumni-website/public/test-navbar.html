<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar Auth Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8">
    <h1 class="text-2xl font-bold mb-4">Navbar Authentication Test</h1>
    
    <!-- Test Controls -->
    <div class="mb-8 p-4 bg-white rounded shadow">
        <h2 class="font-bold mb-2">Test Controls:</h2>
        <button onclick="simulateLogin()" class="bg-blue-500 text-white px-4 py-2 rounded mr-2">Simulate Login</button>
        <button onclick="simulateLogout()" class="bg-red-500 text-white px-4 py-2 rounded">Simulate Logout</button>
        <button onclick="checkStatus()" class="bg-green-500 text-white px-4 py-2 rounded ml-2">Check Status</button>
    </div>

    <!-- Navbar Test -->
    <div class="bg-white shadow-xl p-4 rounded">
        <div class="flex justify-between items-center">
            <h2 class="font-bold">Alumni Network</h2>
            
            <div class="flex items-center space-x-3">
                <!-- Login Button -->
                <div id="login-button-container" class="hidden md:flex">
                    <a id="portal-login-link" href="#" class="px-5 py-2 rounded-md bg-blue-100 hover:bg-blue-600 hover:text-white">Login</a>
                </div>

                <!-- Dashboard Button -->
                <div id="dashboard-button-container" class="hidden">
                    <a id="navbar-dashboard-link" href="#" class="px-5 py-2 rounded-md bg-blue-100 hover:bg-blue-600 hover:text-white">Dashboard</a>
                </div>

                <!-- User Dropdown -->
                <div id="user-dropdown" class="hidden">
                    <span id="navbar-username" class="font-medium">User</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Status Display -->
    <div id="status" class="mt-4 p-4 bg-gray-200 rounded"></div>

    <script>
        function simulateLogin() {
            console.log("Simulating login...");
            localStorage.setItem("token", "test-token-123");
            localStorage.setItem("userData", JSON.stringify({
                name: "Test User",
                email: "test@example.com"
            }));
            loadUserStatus();
        }

        function simulateLogout() {
            console.log("Simulating logout...");
            localStorage.removeItem("token");
            localStorage.removeItem("userData");
            localStorage.removeItem("user");
            loadUserStatus();
        }

        function checkStatus() {
            const loginBtn = document.getElementById("login-button-container");
            const dashBtn = document.getElementById("dashboard-button-container");
            const userDropdown = document.getElementById("user-dropdown");
            
            const status = `
                <strong>Current State:</strong><br>
                Login Button Display: ${loginBtn.style.display || 'default'}<br>
                Login Button Classes: ${loginBtn.className}<br>
                Dashboard Button Display: ${dashBtn.style.display || 'default'}<br>
                Dashboard Button Classes: ${dashBtn.className}<br>
                User Dropdown Classes: ${userDropdown.className}<br>
                Token: ${localStorage.getItem("token") ? "EXISTS" : "NONE"}<br>
                UserData: ${localStorage.getItem("userData") ? "EXISTS" : "NONE"}
            `;
            document.getElementById("status").innerHTML = status;
        }

        function loadUserStatus() {
            console.log("=== loadUserStatus called ===");
            
            const token = localStorage.getItem("token");
            const userData = localStorage.getItem("userData") || localStorage.getItem("user");
            
            console.log("Token exists:", !!token);
            console.log("UserData exists:", !!userData);

            if (token && userData) {
                console.log("User is logged in");
                
                let user;
                try {
                    user = typeof userData === "string" ? JSON.parse(userData) : userData;
                    if (!user) throw new Error("User data is empty");
                } catch (e) {
                    console.error("Error parsing user data:", e);
                    localStorage.removeItem("token");
                    localStorage.removeItem("userData");
                    localStorage.removeItem("user");
                    loadUserStatus();
                    return;
                }

                const userName = user.name || "User";
                
                // HIDE LOGIN BUTTON
                const loginButtonContainer = document.getElementById("login-button-container");
                if (loginButtonContainer) {
                    console.log("HIDING login button");
                    loginButtonContainer.style.display = "none";
                    loginButtonContainer.classList.add("hidden");
                }

                // SHOW DASHBOARD BUTTON
                const dashboardButtonContainer = document.getElementById("dashboard-button-container");
                if (dashboardButtonContainer) {
                    console.log("SHOWING dashboard button");
                    dashboardButtonContainer.style.display = "flex";
                    dashboardButtonContainer.classList.remove("hidden");
                }

                // SHOW USER DROPDOWN
                const userDropdown = document.getElementById("user-dropdown");
                if (userDropdown) {
                    userDropdown.classList.remove("hidden");
                    const navbarUsername = document.getElementById("navbar-username");
                    if (navbarUsername) {
                        navbarUsername.textContent = userName;
                    }
                }
                
                console.log("Logged in UI complete");
            } else {
                console.log("User is NOT logged in");
                
                // SHOW LOGIN BUTTON
                const loginButtonContainer = document.getElementById("login-button-container");
                if (loginButtonContainer) {
                    console.log("SHOWING login button");
                    loginButtonContainer.style.display = "";
                    loginButtonContainer.classList.remove("hidden");
                    loginButtonContainer.classList.add("md:flex");
                }

                // HIDE DASHBOARD BUTTON
                const dashboardButtonContainer = document.getElementById("dashboard-button-container");
                if (dashboardButtonContainer) {
                    console.log("HIDING dashboard button");
                    dashboardButtonContainer.style.display = "none";
                    dashboardButtonContainer.classList.add("hidden");
                }

                // HIDE USER DROPDOWN
                const userDropdown = document.getElementById("user-dropdown");
                if (userDropdown) {
                    userDropdown.classList.add("hidden");
                }
                
                console.log("Logged out UI complete");
            }
            
            checkStatus();
        }

        // Run on page load
        loadUserStatus();
    </script>
</body>
</html>
